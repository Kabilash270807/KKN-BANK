<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKN Bank</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #90EE90;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: #e6ffe6;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            text-align: center;
            color: #65a765;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            background-color: #90EE90;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #90EE90;
        }

        .output {
            margin-top: 20px;
            padding: 10px;
            background: #eef2f7;
            border-radius: 5px;
        }

        .account {
            padding: 10px;
            border-bottom: 1px solid gray;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>KKN Bank Management System</h1>

    <input type="number" id="accNo" placeholder="Account Number">

    <input type="text" id="name" placeholder="Customer Name">

    <input type="number" id="balance" placeholder="Initial Balance">

    <button onclick="createAccount()">Create Account</button>

    <hr>

    <input type="number" id="searchAcc" placeholder="Account Number">

    <input type="number" id="amount" placeholder="Amount">

    <button onclick="deposit()">Deposit Money</button>

    <button onclick="withdrawMoney()">Withdraw Money</button>

    <button onclick="displayAccounts()">Display Accounts</button>

    <div class="output" id="output"></div>

</div>

<script>

    let accounts = [];

    // Create Account
    function createAccount()
    {
        let accNo = document.getElementById("accNo").value;
        let name = document.getElementById("name").value;
        let balance = parseFloat(document.getElementById("balance").value);

        if(accNo === "" || name === "" || isNaN(balance))
        {
            alert("Please fill all fields");
            return;
        }

        let account = {
            accNo: accNo,
            name: name,
            balance: balance
        };

        accounts.push(account);

        alert("Account Created Successfully!");

        document.getElementById("accNo").value = "";
        document.getElementById("name").value = "";
        document.getElementById("balance").value = "";
    }

    // Deposit Money
    function deposit()
    {
        let acc = document.getElementById("searchAcc").value;
        let amount = parseFloat(document.getElementById("amount").value);

        let found = false;

        accounts.forEach(account =>
        {
            if(account.accNo == acc)
            {
                account.balance += amount;
                found = true;

                alert("Amount Deposited Successfully!");
            }
        });

        if(!found)
        {
            alert("Account Not Found!");
        }
    }

    // Withdraw Money
    function withdrawMoney()
    {
        let acc = document.getElementById("searchAcc").value;
        let amount = parseFloat(document.getElementById("amount").value);

        let found = false;

        accounts.forEach(account =>
        {
            if(account.accNo == acc)
            {
                found = true;

                if(amount > account.balance)
                {
                    alert("Insufficient Balance!");
                }
                else
                {
                    account.balance -= amount;

                    alert("Withdrawal Successful!");
                }
            }
        });

        if(!found)
        {
            alert("Account Not Found!");
        }
    }

    // Display Accounts
    function displayAccounts()
    {
        let output = document.getElementById("output");

        output.innerHTML = "<h3>Account Details</h3>";

        if(accounts.length == 0)
        {
            output.innerHTML += "No Accounts Available!";
            return;
        }

        accounts.forEach(account =>
        {
            output.innerHTML += `
                <div class="account">
                    <p><b>Account Number:</b> ${account.accNo}</p>
                    <p><b>Name:</b> ${account.name}</p>
                    <p><b>Balance:</b> ₹${account.balance}</p>
                </div>
            `;
        });
    }

</script>

</body>
</html>
